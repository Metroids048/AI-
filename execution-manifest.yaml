verification:
  required_regression_commands:
    - "npm --workspace frontend/admin run test -- --run"
    - "& $env:AGENT_PYTHON -m pytest tests/api/test_runtime_truth_api.py -q"
    - "git diff --check"
  browser:
    required: true
    pages: [/trading, /strategy, /review, /risk, /validation, /research, /ops]
    inspect: [console_errors, console_warnings, network_frequency, unavailable_after_8_second_timeout, recovery_within_30_seconds, first_fold_at_900p_and_1080p]
  independent_reviewer:
    required: true
    mode: read_only
    inspect: [runtime_truth_chain, forbidden_scope, cumulative_diff_whitelist, user_behavior_assertions]
  external_testnet:
    required: true
    current_status: NOT_RUN_UNTIL_REVIEWED_COMMIT_EXISTS
    check: [wallet_balance, positions, open_orders, runtime_truth_correspondence]

no_commit_diff_protocol:
  per_task:
    - create_read_only_temporary_snapshot_outside_repository
    - compare_task_increment_to_must_may_must_not_sets
    - check_cumulative_git_diff_name_only_against_whitelist
    - run_red_then_focused_regression_and_git_diff_check
    - delete_temporary_snapshot
  prohibited: [temporary_commit, stash, branch, worktree]
  failure_status: STOP_AT_CURRENT_TASK_WITH_REPRODUCIBLE_EVIDENCE

contract_lint:
  parser: PyYAML
  required_top_level_keys:
    - contract_version
    - status
    - base_commit
    - branch
    - document
    - document_sha256
    - commit_allowed
    - push_allowed
    - external_validation
    - problem_ids
    - task_order
    - tasks
    - machine_contract
    - global_must_not_change
    - contract_lint
  checks:
    - required_keys_present
    - P_ids_exact_unique_P_001_to_P_008
    - E_ids_exact_unique_E_001_to_E_009
    - task_order_is_strict
    - every_problem_has_assertion_and_test_coverage
    - every_task_has_must_may_must_not_and_they_are_disjoint
    - must_or_may_paths_do_not_intersect_global_forbidden_patterns
    - existing_declared_paths_exist
    - nonexisting_test_paths_must_be_in_planned_new_test_files
    - machine_runtime_api_state_presentation_layout_contracts_present
    - markdown_yaml_baseline_branch_ids_permissions_external_status_match
    - markdown_sha256_matches_document_sha256
    - repository_diff_contains_only_project_solution_and_manifest_at_contract_stage
    - git_diff_check_passes
  final_status: READY_FOR_PROMPT3_PREFLIGHT
  forbidden_statuses: [EXECUTION_READY, EXTERNAL_TESTNET_ACCEPTED]
