machine_contract:
  runtime_api:
    endpoint: /api/v1/runtime/snapshot
    location: exchange.value.account
    numeric_fields:
      - wallet_balance
      - available_balance
      - margin_balance
      - unrealized_pnl
      - open_position_count
    unavailable_semantics: runtime_datum_is_STALE_or_UNAVAILABLE_never_numeric_zero_placeholder
    exchange_probe:
      cache_seconds: 15
      hard_timeout_seconds: 8
      single_probe_lock: true
      stale_fallback: true
    gateway_reconcile:
      account_summary_option_default: false
      existing_automatic_scheduler_behavior: regression_equivalent
      allowed_behavior: read_reconcile_account_summary_only
  runtime_provider:
    mount: QueryClientProvider_inside__PlatformLayout_outside_Outlet
    rest_websocket_chain: one_shared_chain_for_the_whole_application
    page_responsibility: read_filter_present_only
    forbidden_active_runtime_sources:
      - useAutomatedTradingRuntime
      - fetchPositions
      - /api/v1/execution/binance-testnet-account
      - legacy_overview_orders_as_exchange_orders
  request_lifecycle:
    request_forwards_abort_signal: true
    abort_error_is_service_error: false
    selection_single_flight: true
    abort_on_selection_change: true
    abort_on_unmount: true
    schedule_next_only_after_refresh_complete: true
  data_state:
    values: [LOADING, AVAILABLE, STALE, UNAVAILABLE, EMPTY]
    empty_requires_successful_empty_response: true
    stale_keeps_last_valid_value: true
    unknown_risk_maps_to: 状态待确认
    unknown_risk_may_map_to_normal: false
    readiness_layers: [api, scheduler, frontend, automated_trading_engine, market_data, binance_testnet, account_data]
  presentation:
    owner: frontend/admin/src/utils/format.js
    mappings:
      pending: 待处理
      healthy: 正常
      degraded: 异常/降级
      configured: 已配置
      missing: 未配置
      long: 做多
      short: 做空
      ACTIVE: 已启用
      BINANCE_TESTNET: 币安模拟盘
      "true": 是
      "false": 否
    field_labels:
      execution_engine: 执行引擎
      optimization_method: 优化方式
      implementation_status: 接入状态
      scheduler_error: 调度器异常
      next_cycle_eta_seconds: 距下次执行
      risk_profile: 风控配置
      operator_risk_per_trade: 单笔风险比例
      generic_risk_profile_max_leverage: 默认最大杠杆
    professional_terms_allowlist: [BTC, ETH, SOL, Binance, GitHub, LLM, RAG, API, MACD, RSI, EMA, ADX, VWAP, Sharpe, Freqtrade, Hyperopt]
    create_parallel_i18n_layer: false
  layout:
    direction: binance_inspired_light_workstation
    kline_height: clamp(280px, 38vh, 420px)
    kline_min_height: 280px
    desktop_first_fold: [account_status, kline, records_tabs]
    record_area_scroll: internal_only
    dark_usage: [tooltip, chart_local, special_risk_warning]
    forbidden: [large_dark_hero_as_separate_theme, fixed_500px_kline, fixed_610px_trading_min_height, third_theme_override]

