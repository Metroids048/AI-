# Install both commit and push hooks:
#   pre-commit install --install-hooks -t pre-commit -t pre-push
default_install_hook_types: [pre-commit, pre-push]

repos:
  # Keep ruff >=0.13 so UP038 (isinstance tuple→union) stays gone — old 0.6.x
  # fought local ruff 0.15+ and repeatedly blocked commits on the same files.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: end-of-file-fixer
        exclude: ^(docs/archive/|scripts/archive/)
        stages: [pre-commit]
      - id: trailing-whitespace
        exclude: ^(docs/archive/|scripts/archive/)
        stages: [pre-commit]
      - id: check-added-large-files
        args: [--maxkb=2048]   # guard against committing alpha CSVs / docx blobs
        exclude: ^docs/evidence/runtime-ledger/
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        additional_dependencies: [pydantic>=2.8]
        pass_filenames: false
        args: [--config-file=pyproject.toml]
        stages: [pre-commit]

  # Local hooks. These close the gap that let a red suite reach main: until now
  # pre-commit ran lint/format/type only, so "looks fine locally" was possible
  # with failing tests, and CI was the first thing to notice.
  - repo: local
    hooks:
      # Runs the name-matched test subset when trading-critical code is staged.
      # Deliberately scoped to services/execution, services/validation,
      # services/strategy_library and apps/api/routers instead of the whole
      # suite: a ~75s full run on every commit gets bypassed, and a bypassed
      # gate is worth nothing.
      - id: targeted-trading-tests
        name: pytest subset for trading-critical changes
        entry: python scripts/precommit_targeted_tests.py
        language: system
        pass_filenames: true
        files: ^(services/(execution|validation|strategy_library)/|apps/api/routers/).*\.py$
        stages: [pre-commit]

      # The three per-tool verify-work skill copies must stay byte-identical to
      # the canonical .agents/ source. Editing one and forgetting the others is
      # how they silently diverge.
      - id: verify-work-skill-sync
        name: verify-work skill copies match canonical source
        entry: python scripts/sync_skill_copies.py --check
        language: system
        pass_filenames: false
        files: ^\.(agents|claude|cursor)/skills/verify-work/SKILL\.md$
        stages: [pre-commit]

      # Blocks the "commit failed but push succeeded" empty-push pattern:
      # if the worktree is still dirty, there is nothing new to publish yet.
      - id: refuse-push-dirty-worktree
        name: refuse push when worktree has uncommitted changes
        entry: python scripts/prepush_refuse_dirty_worktree.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
