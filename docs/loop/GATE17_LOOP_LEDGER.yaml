    root_cause_detail: |
      三层证据链:
      1. Regime分布失衡:2449/2556(95.8%)决策发生在RANGE regime,只有107(4.2%)在TREND/UNCERTAIN
      2. 过滤规则严格:RANGE regime下代码(L327-328)硬性要求signal layer必须是"range"才能投票
      3. 信号池不匹配:RANGE_SOURCES只有technical_vwap和technical_bollinger两个策略,
         7天内触发542次(vwap:332,bollinger:210),只占总策略触发7518次的7.2%,
         而非range层策略(technical_ema_trend占11.4%,market_intelligence占25.6%)大量触发但被过滤

      直接后果:1921/2449(78.4%)的RANGE ensemble因eligible_count=0(无range层信号或数量不足)被丢弃,
      这些决策中包含的非range层信号(technical_ema_trend/macd/price_action等)全部作废。

      这不是代码bug,是业务规则(RANGE regime只允许range层信号)与实际信号池分布(range层信号稀缺)的结构性不匹配。

    business_decision_required: |
      已选择方案A+C组合作为临时修复:

      方案A(放宽融合规则):修改_eligible_layered_signals逻辑,RANGE regime下允许部分非range层信号投票
                        (例如允许macd/price_action等entry层信号参与,但保留direction层的过滤)

      方案C(调整regime判定):收紧RANGE regime的判定条件(新增ADX<15要求),让更多决策落入TREND regime,
                            使现有以趋势跟随为主的策略池能更高频参与投票

      方案B(扩充信号池):增加更多range层策略(例如mean_reversion/支撑阻力位bounce/区间震荡突破等),
                        提高range层信号触发密度,使其在RANGE regime下能形成有效投票
                        → 作为中期补强方案（1-2周），完成后回滚方案A

      三个方案各有利弊:
      - 方案A最快(纯代码改动),但可能引入noise(趋势策略在震荡市的误判)
      - 方案B最稳健(符合分层设计初衷),但需要时间开发和验证新的range策略
      - 方案C最简单(改一个阈值),但可能让regime分类失去意义

      当前系统行为:"宁可不开单,也不用错误的策略类型",这是fail-closed设计,
      如果接受"在RANGE市场下适度放宽策略类型限制"的风险,方案A可以最快解除瓶颈。
