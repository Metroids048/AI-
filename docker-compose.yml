version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: ai-quant-postgres
    environment:
      POSTGRES_DB: ai_quant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ai-quant-redis
    ports:
      - "6379:6379"

  api:
    image: python:3.12-slim
    container_name: ai-quant-api
    working_dir: /app
    command: >
      sh -c "pip install -e . &&
      uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./:/app
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:

