[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-quant-research-platform"
version = "0.1.0"
description = "Report-aligned AI quant research platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.139,<1.0",
  "starlette>=1.3.1,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.14.2,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.0,<6.0",
  "celery>=5.4,<6.0",
  "httpx>=0.27,<1.0",
  "ccxt>=4.3,<5.0",
  "aiohttp>=3.14.1,<4.0",
  "cryptography>=48.0.1,<49.0",
  "PyJWT>=2.13,<3.0",
  "python-multipart>=0.0.32,<1.0",
  "websockets>=12.0,<16.0",
  "pandas>=2.3,<4.0",
  "numpy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "prometheus-client>=0.21,<1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.4,<2.0",
  "pytest-cov>=7.1,<8.0",
  "ruff>=0.13,<1.0",
  "mypy>=1.11,<2.0"
]
llm = [
  "anthropic>=0.39,<1.0",
  "langchain>=0.3,<0.4",
  "llama-index>=0.11,<0.12"
]
quant = [
  "freqtrade>=2024.9",
  "backtrader>=1.9.78.123",
  "vectorbt>=0.26,<1.0",
  "pandas-ta>=0.3.14b"
  # "TA-Lib>=0.4"  # optional: needs system C library; pandas-ta covers Phase 0
]
ml = [
  "scikit-learn>=1.5,<2.0",
  "joblib>=1.4,<2.0"
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "services*", "shared*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "testnet_contract: real Binance Testnet network test (Task 16). Skipped unless V2_TESTNET_CONTRACT_ENABLED=true.",
    "natural_e2e: natural Scheduler end-to-end Testnet test (Task 17). Skipped unless V2_NATURAL_E2E_ENABLED=true.",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["scripts/archive", "docs/archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"apps/api/routers/*.py" = ["B008"]
# Ops/diagnostic one-off scripts: keep them commitable without blocking product code.
# Still linted for hard errors (F821 etc.); style noise is ignored.
"scripts/*.py" = ["E402", "E501", "E702", "E722", "F841", "B007", "SIM115"]

[tool.ruff.lint.isort]
known-first-party = ["shared", "services", "apps"]

[tool.mypy]
python_version = "3.11"
files = ["shared", "services", "apps"]
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_optional = true
ignore_missing_imports = true
