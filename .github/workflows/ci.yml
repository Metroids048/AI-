name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Python dependency audit
        run: |
          python -m pip install pip-audit
          pip-audit --progress-spinner off
      - name: Pytest
        run: pytest -q -m "not integration"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend tests
        run: npm --workspace frontend/admin run test
      - name: Frontend dependency audit report
        run: npm audit --audit-level=high || true
      - name: Frontend build
        run: npm run admin:build

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare compose env template
        run: cp .env.example .env
      - name: Validate docker-compose
        run: python scripts/compose_validate.py --require-docker
