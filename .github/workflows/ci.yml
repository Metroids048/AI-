name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Python dependency audit
        run: |
          python -m pip install pip-audit
          pip-audit --progress-spinner off
      - name: Pytest
        run: pytest -q -m "not integration" --junit-xml=.pytest-report.xml
      - name: Verify CURRENT_STATE.md verification block is current
        # Regenerated from the JUnit report above, so the documented count is
        # always a real number from a real run rather than a hand-typed claim.
        run: python scripts/refresh_current_state.py --junit-xml .pytest-report.xml --check
      - name: Verify per-tool skill copies have not drifted
        run: python scripts/sync_skill_copies.py --check
      - name: Verify active manifest evidence
        run: python scripts/verify_current_state_evidence.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend tests
        run: npm --workspace frontend/admin run test
      - name: Frontend dependency audit report
        run: npm audit --audit-level=high
      - name: Frontend build
        run: npm run admin:build

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare compose env template
        run: cp .env.example .env
      - name: Validate docker-compose
        run: python scripts/compose_validate.py --require-docker
