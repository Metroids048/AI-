name: Temporary Mypy Platform Fix

on:
  push:
    branches:
      - fix/ci-ruff-formatter-contract

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-ruff-formatter-contract
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply narrow platform-stub annotations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "services/automated_trading/infrastructure/account_writer.py": [
                  (
                      "            msvcrt.locking(lock_file.fileno(), msvcrt.LK_LOCK, 1)",
                      "            msvcrt.locking(lock_file.fileno(), msvcrt.LK_LOCK, 1)  # type: ignore[attr-defined]",
                  ),
                  (
                      "            fcntl.flock(lock_file.fileno(), fcntl.LOCK_EX)  # type: ignore[attr-defined]",
                      "            fcntl.flock(lock_file.fileno(), fcntl.LOCK_EX)",
                  ),
                  (
                      "                msvcrt.locking(lock_file.fileno(), msvcrt.LK_UNLCK, 1)",
                      "                msvcrt.locking(lock_file.fileno(), msvcrt.LK_UNLCK, 1)  # type: ignore[attr-defined]",
                  ),
                  (
                      "                fcntl.flock(lock_file.fileno(), fcntl.LOCK_UN)  # type: ignore[attr-defined]",
                      "                fcntl.flock(lock_file.fileno(), fcntl.LOCK_UN)",
                  ),
                  (
                      "    kernel32 = ctypes.WinDLL(\"kernel32\", use_last_error=True)",
                      "    kernel32 = ctypes.WinDLL(\"kernel32\", use_last_error=True)  # type: ignore[attr-defined]",
                  ),
                  (
                      "    handle = kernel32.OpenProcess(process_query_limited_information, False, pid)\n    if not handle:\n        return ProcessLiveness.DEAD if ctypes.get_last_error() == error_invalid_parameter else ProcessLiveness.UNKNOWN",
                      "    get_last_error = getattr(ctypes, \"get_last_error\")\n    handle = kernel32.OpenProcess(process_query_limited_information, False, pid)\n    if not handle:\n        return ProcessLiveness.DEAD if get_last_error() == error_invalid_parameter else ProcessLiveness.UNKNOWN",
                  ),
              ],
              "services/execution/scheduler_coordination.py": [
                  (
                      "        handle = ctypes.windll.kernel32.OpenProcess(process_query_limited_information, False, pid_i)",
                      "        handle = ctypes.windll.kernel32.OpenProcess(  # type: ignore[attr-defined]\n            process_query_limited_information, False, pid_i\n        )",
                  ),
                  (
                      "            ctypes.windll.kernel32.CloseHandle(handle)",
                      "            ctypes.windll.kernel32.CloseHandle(handle)  # type: ignore[attr-defined]",
                  ),
              ],
              "services/execution/runtime_state.py": [
                  (
                      "    kernel32 = ctypes.windll.kernel32",
                      "    kernel32 = ctypes.windll.kernel32  # type: ignore[attr-defined]",
                  ),
              ],
          }

          for raw_path, pairs in replacements.items():
              path = Path(raw_path)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"expected exactly one match in {raw_path}: {old!r}; got {count}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Verify formatter and type checker
        run: |
          pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          mypy
          git diff --check
      - name: Commit narrow typing changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/automated_trading/infrastructure/account_writer.py services/execution/scheduler_coordination.py services/execution/runtime_state.py
          git commit -m "fix(ci): type Windows-only runtime APIs explicitly"
          git push origin HEAD:fix/ci-ruff-formatter-contract
